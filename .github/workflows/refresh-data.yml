name: Refresh DC master data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-data.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download upstream raw snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/human_override raw/atlas raw/compute_atlas raw/peeringdb raw/japan_dc_watch

          curl -L --fail --retry 3             https://raw.githubusercontent.com/BoVerse-io/human-override/main/data/datacenters.csv             -o raw/human_override/datacenters.csv

          curl -L --fail --retry 3             https://raw.githubusercontent.com/Ringmast4r/Global-Data-Center-Map/main/datacenters.csv             -o raw/atlas/datacenters.csv

          curl -L --fail --retry 3             https://raw.githubusercontent.com/ek33450505/compute-atlas/main/data/facilities.json             -o raw/compute_atlas/facilities.json

          curl -L --fail --retry 3             "https://www.peeringdb.com/api/fac?limit=10000"             -o raw/peeringdb/facilities.json

          curl -L --fail --retry 3             https://japandatacenter.org/api/v1/facilities             -o raw/japan_dc_watch/facilities.json

          date -u +"%Y-%m-%dT%H:%M:%SZ" > raw/retrieved_at_utc.txt

      - name: Build harmonized master
        run: |
          python scripts/build_master.py
          python scripts/enrich_observations.py

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw processed
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh open DC snapshots [skip ci]"
            git push
          fi
