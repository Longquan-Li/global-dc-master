name: Build Global DC Facility Database

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-data.yml"
      - "scripts/**"
      - "sources/**"
      - "requirements.txt"
  workflow_dispatch:
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download upstream raw snapshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p raw/human_override raw/atlas raw/compute_atlas raw/peeringdb raw/japan_dc_watch

          curl -L --fail --retry 3             https://raw.githubusercontent.com/BoVerse-io/human-override/main/data/datacenters.csv             -o raw/human_override/datacenters.csv

          curl -L --fail --retry 3             https://raw.githubusercontent.com/Ringmast4r/Global-Data-Center-Map/main/datacenters.csv             -o raw/atlas/datacenters.csv

          curl -L --fail --retry 3             https://raw.githubusercontent.com/ek33450505/compute-atlas/main/data/facilities.json             -o raw/compute_atlas/facilities.json

          curl -L --fail --retry 3             "https://www.peeringdb.com/api/fac?limit=10000"             -o raw/peeringdb/facilities.json

          curl -L --fail --retry 3             https://japandatacenter.org/api/v1/facilities             -o raw/japan_dc_watch/facilities.json

          date -u +"%Y-%m-%dT%H:%M:%SZ" > raw/retrieved_at_utc.txt

      - name: Fetch Japan facility detail records
        run: python scripts/fetch_japan_details.py

      - name: Fetch supplementary open sources
        shell: bash
        run: |
          python scripts/fetch_china_scidata.py || echo "China ScienceDB fetch incomplete; raw diagnostic retained where available."
          python scripts/fetch_dset_raw.py || echo "DSET fetch incomplete; raw diagnostic retained where available."
          python scripts/fetch_osm_datacenters.py || echo "OSM fetch incomplete; workflow continues."

      - name: Build harmonized facility database
        run: |
          python scripts/build_master.py
          python scripts/enrich_observations.py
          python scripts/build_operator_queue.py
          python scripts/build_simple_export.py

      - name: Upload simple DC export
        uses: actions/upload-artifact@v4
        with:
          name: reported-power-simple
          path: processed/reported_power_simple.csv
          if-no-files-found: error
          retention-days: 7

      - name: Commit refreshed data
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw processed
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: refresh open DC snapshots [skip ci]"
            git pull --rebase origin main
            git push
          fi
